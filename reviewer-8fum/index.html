const io = new IntersectionObserver(es => {

</script><script>(()=>{const r=document.documentElement,K="rebuttal-theme",mq=matchMedia("(prefers-color-scheme: light)");document.querySelector(".theme-btn").addEventListener("click",()=>{const light=r.dataset.theme?r.dataset.theme==="light":mq.matches,next=light?"dark":"light";try{if((next==="light")===mq.matches){delete r.dataset.theme;localStorage.removeItem(K)}else{r.dataset.theme=next;localStorage.setItem(K,next)}}catch(e){r.dataset.theme=next}});})();</script><script>document.querySelectorAll(".swap").forEach(box=>{const master=box.querySelector(".view-switch.master"),figs=[...box.querySelectorAll("figure[data-show]")];const press=(sw,side)=>sw.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.show===side)));const show=(f,side)=>{f.dataset.show=side;press(f.querySelector(".view-switch"),side);if(f.dataset.on!=="1")return;f.querySelectorAll("video").forEach(v=>{if(!v.src)v.src=v.dataset.u;v.currentTime=0;v.play().catch(err=>{if(err.name!=="AbortError")throw err;});});};box.addEventListener("click",ev=>{const b=ev.target.closest(".view-switch button");if(!b)return;if(b.closest(".view-switch")===master){press(master,b.dataset.show);figs.forEach(f=>show(f,b.dataset.show));}else show(b.closest("figure"),b.dataset.show);});});</script></body></html>
